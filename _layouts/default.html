<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="masthead">
    <div class="wrap">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="site-tagline">{{ site.tagline }}</p>
    </div>
  </header>

  <nav class="tab-index">
    <a class="tab-all" href="{{ '/' | relative_url }}">All entries</a>
    {% for cat in site.categories_order %}
      <a class="tab-{{ cat.name | downcase }}-bg" href="{{ '/category/' | append: cat.name | downcase | relative_url }}.html">{{ cat.name }}</a>
    {% endfor %}
    <a href="{{ '/about.html' | relative_url }}">About</a>
  </nav>

  <div class="wrap">
    {{ content }}
  </div>

  <footer class="site-footer">
    <div class="wrap">
      &copy; {{ 'now' | date: "%Y" }} {{ site.author }}. Built with Jekyll, hosted on GitHub Pages.
    </div>
  </footer>

</body>
</html>
